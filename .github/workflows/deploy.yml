name: Deploy Brand-er

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: jwmzjszdjlrqrhadbggr
  APP_BASE_URL: https://brand-er1.github.io/clothology-express
  # 결제 운영 모드 (src/services/payment/config.ts). 저장소 Settings → Variables 의 PAYMENT_MODE 로 바꾼다.
  # disabled(기본): 결제 미오픈 — PG 시크릿 없이도 나머지 기능을 배포한다. live: KSNET 실결제. test: PG 시험 환경.
  # 운영 빌드에서 mock 은 항상 disabled 로 처리된다.
  PAYMENT_MODE: ${{ vars.PAYMENT_MODE || 'disabled' }}

jobs:
  verify:
    name: Verify checkout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm test
      - run: npm run test:payments
      - run: npm run check:payments
      - run: npm run test:functions
      - run: npx tsc --noEmit -p tsconfig.app.json

  backend:
    name: Deploy Supabase
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.109.1

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Check required payment secrets when online payment is enabled
        # 결제를 열 때(live/test)만 PG 시크릿을 요구한다. 결제 미오픈(disabled)이면 PG 설정 없이 배포한다.
        if: env.PAYMENT_MODE == 'live' || env.PAYMENT_MODE == 'test'
        shell: bash
        run: |
          names="$(supabase secrets list --project-ref "$SUPABASE_PROJECT_ID" -o json | jq -r '.[].name')"
          for required in KSNET_MID KSNET_AUTH_HEADER APP_URL; do
            if ! grep -Fxq "$required" <<< "$names"; then
              echo "::error::Set the Supabase secret $required before deploying real checkout."
              exit 1
            fi
          done

      - name: Apply database migrations
        run: supabase db push --include-all --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy edge functions
        run: |
          supabase functions deploy generate-optimized-image --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy analyze-production-estimate --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy save-order --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy modify-generated-image --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy dress-character --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy virtual-fitting --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy edit-closet-garment --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy generate-multi-angle --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy screen-trademark-image --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy kakaopay-ready --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy kakaopay-approve --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy kakaopay-cancel --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy ksnet-ready --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy ksnet-return --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
          supabase functions deploy creator-cancel-participation --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy delete-funding --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy admin-manage-user --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy update-system-prompt --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy generate-detail-page --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy generate-detail-image --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy dispatch-notifications --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy generate-color-image --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy edit-ai-image --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy generate-product-shot --project-ref "$SUPABASE_PROJECT_ID"
          supabase functions deploy get-fashion-trends --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
          supabase functions deploy fetch-article-meta --project-ref "$SUPABASE_PROJECT_ID"

      - name: Allow GitHub Pages auth callback
        continue-on-error: true
        shell: bash
        run: |
          config="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth")"
          current="$(jq -r '.uri_allow_list // ""' <<<"$config")"
          callback="$APP_BASE_URL/auth/callback"
          if tr ',' '\n' <<<"$current" | sed 's/^ *//;s/ *$//' | grep -Fxq "$callback"; then
            exit 0
          fi
          updated="${current:+$current,}$callback"
          payload="$(jq -n --arg uri_allow_list "$updated" '{uri_allow_list: $uri_allow_list}')"
          curl --fail --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth" \
            >/dev/null

  frontend:
    name: Deploy GitHub Pages
    # Checkout must not switch providers before its database/functions are deployed.
    needs: backend
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build
        env:
          VITE_PAYMENT_MODE: ${{ env.PAYMENT_MODE }}
        run: npm run build

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
