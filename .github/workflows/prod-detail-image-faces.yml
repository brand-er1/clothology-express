name: Prod E2E - Detail image faces

# 운영 상세페이지 AI 이미지를 유형별로 여러 번 실제 생성해 얼굴 없음 · 의류 중심 · 로고/글자 없음 · 원본 디자인 유지를 확인한다.
# E2E_CREATOR_EMAIL / E2E_CREATOR_PASSWORD 필요. 실제 AI 비용이 들어 수동 실행만:
# Actions 탭 → "Prod E2E - Detail image faces" → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prod-e2e-detail-image-faces
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production E2E
        env:
          E2E_CREATOR_EMAIL: ${{ secrets.E2E_CREATOR_EMAIL }}
          E2E_CREATOR_PASSWORD: ${{ secrets.E2E_CREATOR_PASSWORD }}
          E2E_SHOTS: e2e-shots
        run: node scripts/e2e/prod-detail-image-faces.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-e2e-detail-image-faces
          path: e2e-shots
          if-no-files-found: ignore
