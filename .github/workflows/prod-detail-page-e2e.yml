name: Prod E2E - AI detail page

# 운영 사이트/운영 Supabase 를 대상으로 AI 상세페이지 흐름과 서버 차단을 검증한다.
# Part A(비로그인 서버 차단)는 항상 실행되고, Part B(제작자 전체 흐름 · 실제 AI)는
# E2E_CREATOR_EMAIL / E2E_CREATOR_PASSWORD 시크릿이 있을 때만 실행된다. 만든 테스트 데이터는 마지막에 삭제한다.
on:
  workflow_dispatch:
  push:
    branches: [claude/wizardly-knuth-yxpnwp]
    paths:
      - scripts/e2e/prod-detail-page.mjs
      - .github/workflows/prod-detail-page-e2e.yml

permissions:
  contents: read

concurrency:
  group: prod-e2e-detail-page
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Run production E2E
        env:
          E2E_CREATOR_EMAIL: ${{ secrets.E2E_CREATOR_EMAIL }}
          E2E_CREATOR_PASSWORD: ${{ secrets.E2E_CREATOR_PASSWORD }}
          E2E_SHOTS: e2e-shots
        run: node scripts/e2e/prod-detail-page.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-e2e-detail-page
          path: e2e-shots
          if-no-files-found: ignore
