name: Smoke test guest order (temporary)

on:
  workflow_dispatch:
  push:
    branches:
      - claude/smoke-test-guest-order

jobs:
  cleanup-test-order:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh session for the CI test user and soft-delete its test order
        run: |
          set -e
          ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp3bXpqc3pkamxycXJoYWRiZ2dyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDA1NDA1MDAsImV4cCI6MjA1NjExNjUwMH0.PRCN-ynznky69N5pMYGALFZZpjj2OaFoPNbB7AvRaGc"
          BASE_URL="https://jwmzjszdjlrqrhadbggr.supabase.co"
          ORDER_ID="cab60e31-c93a-43c5-8cdd-4f7ff40869b6"
          USER_ID="4679bd4c-26f8-401f-9eb8-e80e00f98c08"
          REFRESH_TOKEN="mvxatvnhjsyh"

          echo "== Refresh session for the earlier CI test user =="
          REFRESH_RESPONSE=$(curl -sS -X POST "$BASE_URL/auth/v1/token?grant_type=refresh_token" \
            -H "apikey: $ANON_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"refresh_token\":\"$REFRESH_TOKEN\"}")
          ACCESS_TOKEN=$(echo "$REFRESH_RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('access_token') or '')")

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "Could not refresh session (refresh token likely expired) — skipping, needs manual admin cleanup."
            exit 0
          fi

          echo "== Soft-delete (status=deleted) the test order via the app's own owner-scoped update path =="
          curl -sS -i -X PATCH "$BASE_URL/rest/v1/orders?id=eq.$ORDER_ID&user_id=eq.$USER_ID" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d '{"status":"deleted"}'
