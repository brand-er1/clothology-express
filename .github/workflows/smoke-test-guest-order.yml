name: Smoke test guest order (temporary)

on:
  workflow_dispatch:
  push:
    branches:
      - claude/smoke-test-guest-order

jobs:
  check-live-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the live site's index.html and check which JS bundle + cache headers it serves
        run: |
          set -x
          curl -sS -i "https://brand-er1.github.io/clothology-express/" -o /tmp/live-index.html
          echo "=== Referenced script tags ==="
          grep -oE '(src|href)="[^"]*\.(js|css)"' /tmp/live-index.html || true
          echo "=== Headers only ==="
          curl -sS -I "https://brand-er1.github.io/clothology-express/"
