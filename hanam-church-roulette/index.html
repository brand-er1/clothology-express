<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>하남교회 오후프로그램</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;background:linear-gradient(#f5f0ff,#fff);color:#171717}main{max-width:520px;margin:auto;padding:25px 18px 45px;text-align:center}.badge{display:inline-block;background:#e9e1ff;color:#654db8;padding:7px 12px;border-radius:999px;font-weight:800;font-size:13px}h1{margin:9px 0 4px;font-size:29px}.sub{margin:0 0 20px;color:#777}.box{width:min(86vw,370px);height:min(86vw,370px);margin:0 auto 22px;position:relative}.pointer{position:absolute;z-index:9;top:-8px;left:50%;transform:translateX(-50%);border-left:18px solid transparent;border-right:18px solid transparent;border-top:37px solid #111}#wheel{position:absolute;inset:0;border-radius:50%;overflow:hidden;box-shadow:0 15px 35px #0002;transition:transform 3.5s cubic-bezier(.1,.75,.08,1);background:conic-gradient(#eadfff 0 60deg,#ffdfe8 60deg 120deg,#ffedce 120deg 180deg,#dff3ff 180deg 240deg,#e0f4de 240deg 300deg,#f2e2ff 300deg 360deg)}.lab{position:absolute;left:50%;top:50%;width:46%;transform-origin:0 0;text-align:right;padding-right:8px;font-size:12px;font-weight:900}.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:82px;height:82px;border-radius:50%;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px}button{width:100%;border:0;border-radius:16px;padding:16px;background:#111;color:white;font-size:18px;font-weight:900}button:disabled{opacity:.5}#result{display:none;margin-top:18px;padding:17px;background:#fff;border-radius:22px;box-shadow:0 10px 30px #0001;text-align:left}#result.show{display:block}#result img{width:100%;max-height:430px;object-fit:contain;border-radius:17px;background:#eee}.k{font-size:12px;color:#765dc4;font-weight:900;margin-top:13px}h2{margin:5px 0 0;font-size:25px}.note{font-size:12px;color:#999;margin-top:13px}</style></head><body><main><div class="badge">하남교회</div><h1>오후프로그램 🎯</h1><p class="sub">룰렛을 돌리고 나온 자세를 사진처럼 따라 해보세요!</p><div class="box"><div class="pointer"></div><div id="wheel"><div class="hub">GO!</div></div></div><button id="spin">룰렛 돌리기</button><section id="result"><img id="photo"><div class="k">🎉 선정된 자세</div><h2 id="title"></h2></section><div class="note">선정되면 실제 참고 사진이 바로 표시됩니다.</div></main><script>const poses=[{name:'커플 V자 밸런스',image:'https://raw.githubusercontent.com/brand-er1/clothology-express/main/hanam-church-roulette/pose1.jpeg'},{name:'손잡고 뒤로 기울이기',image:'https://raw.githubusercontent.com/brand-er1/clothology-express/main/hanam-church-roulette/pose2.jpeg'},{name:'등 맞대고 스쿼트',image:'https://raw.githubusercontent.com/brand-er1/clothology-express/main/hanam-church-roulette/pose3.jpeg'},{name:'마주 보고 한쪽 다리 들기',image:'https://raw.githubusercontent.com/brand-er1/clothology-express/main/hanam-church-roulette/pose4.jpeg'},{name:'커플 발 맞대기',image:'https://raw.githubusercontent.com/brand-er1/clothology-express/main/hanam-church-roulette/pose5.jpeg'},{name:'더블 보트 포즈',image:'https://raw.githubusercontent.com/brand-er1/clothology-express/main/hanam-church-roulette/pose6.jpeg'}];const wheel=document.getElementById('wheel'),btn=document.getElementById('spin'),res=document.getElementById('result');poses.forEach((p,i)=>{let d=document.createElement('div');d.className='lab';let a=i*60+30;d.style.transform=`rotate(${a}deg)`;d.textContent=p.name;wheel.appendChild(d)});let rotation=0,busy=false;function go(){if(busy)return;busy=true;btn.disabled=true;res.classList.remove('show');let i=Math.floor(Math.random()*poses.length),center=i*60+30,desired=(360-center)%360,cur=((rotation%360)+360)%360;rotation+=((desired-cur+360)%360)+2160;wheel.style.transform=`rotate(${rotation}deg)`;setTimeout(()=>{document.getElementById('photo').src=poses[i].image;document.getElementById('title').textContent=poses[i].name;res.classList.add('show');btn.disabled=false;busy=false;res.scrollIntoView({behavior:'smooth',block:'nearest'})},3600)}btn.onclick=go;</script></body></html>
