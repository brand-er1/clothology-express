    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0 H0 V32" fill="none" stroke="#e7e1df" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="800" height="1000" fill="#1f191a"/>
  <!-- 태블릿 -->
  <rect x="90" y="170" width="620" height="700" rx="44" fill="#3a3133"/>
  <rect x="118" y="198" width="564" height="644" rx="24" fill="#ffffff"/>
  <rect x="118" y="198" width="564" height="644" rx="24" fill="url(#grid)"/>
  <!-- 상단 바 -->
  <g font-family="Pretendard, 'Apple SD Gothic Neo', Arial, sans-serif">
