  <g font-family="Pretendard, 'Apple SD Gothic Neo', Arial, sans-serif" font-size="24" font-weight="700">
    <rect x="160" y="660" width="140" height="52" rx="26" fill="#f6e8ea"/>
    <text x="230" y="694" text-anchor="middle" fill="#7a0415"># 오버핏</text>
    <rect x="316" y="660" width="140" height="52" rx="26" fill="#7a0415"/>
    <text x="386" y="694" text-anchor="middle" fill="#ffffff"># 버건디</text>
    <rect x="472" y="660" width="164" height="52" rx="26" fill="#f6e8ea"/>
    <text x="554" y="694" text-anchor="middle" fill="#7a0415"># 별 자수</text>
    <rect x="160" y="730" width="476" height="60" rx="14" fill="#f4f2f1"/>
    <rect x="178" y="752" width="300" height="16" rx="8" fill="#7a0415"/>
    <rect x="178" y="752" width="430" height="16" rx="8" fill="#7a0415" fill-opacity=".18"/>
