    <path d="M82 48 Q100 30 118 48 Q100 72 82 48 Z" fill="#5c0310"/>
    <path d="M70 144 H130 L120 168 H80 Z" fill="#5c0310"/>
    <path d="M92 62 V94 M108 62 V94" stroke="#f3eee8" stroke-width="3" stroke-linecap="round"/>
    <!-- 가슴 자수 포인트 -->
    <path d="M100 104 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4 z" fill="#f3eee8"/>
    <path d="M48 98 V182 M152 98 V182" stroke="#f3eee8" stroke-opacity=".5" stroke-width="2" stroke-dasharray="5 5"/>
  </g>
  <!-- 생성 화살표 -->
  <path d="M300 430 Q318 410 336 430" fill="none" stroke="#7a0415" stroke-width="5" stroke-linecap="round"/>
  <path d="M330 418 L338 432 L322 434" fill="none" stroke="#7a0415" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
