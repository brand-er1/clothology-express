<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="태블릿 화면에서 인터뷰 키워드로 AI가 후드티 디자인을 시각화하는 일러스트">
  <title>STEP 02 · AI DESIGN</title>
  <defs>
