  <rect width="800" height="1000" fill="#f6e8ea"/>
  <!-- 작업대 -->
  <rect x="0" y="620" width="800" height="380" fill="#e2c9cd"/>
  <rect x="0" y="610" width="800" height="22" fill="#c999a4"/>

  <!-- 원단 롤 -->
