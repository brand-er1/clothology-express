  <g font-family="Pretendard, 'Apple SD Gothic Neo', Arial, sans-serif" font-weight="800">
    <rect x="530" y="48" width="222" height="52" rx="26" fill="#7a0415"/>
    <text x="641" y="82" text-anchor="middle" font-size="22" fill="#ffffff" letter-spacing="2">STEP 03</text>
