    <ellipse cx="165" cy="140" rx="30" ry="9" fill="#2b0207"/>
    <g stroke="#5c0310" stroke-width="3" opacity=".6">
      <path d="M90 200 V560"/><path d="M130 190 V570"/><path d="M200 190 V570"/><path d="M240 200 V560"/>
    </g>
  </g>

  <!-- 패턴 조각 (후드 앞판) -->
  <g>
    <path d="M330 360 L410 330 Q480 380 550 330 L630 360 L660 470 L610 480 L600 430 L600 640 L360 640 L360 430 L350 480 L300 470 Z" fill="#ffffff"/>
    <path d="M330 360 L410 330 Q480 380 550 330 L630 360 L660 470 L610 480 L600 430 L600 640 L360 640 L360 430 L350 480 L300 470 Z" fill="none" stroke="#7a0415" stroke-width="4" stroke-dasharray="14 10"/>
