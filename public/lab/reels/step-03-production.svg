  <!-- 실패 + 바늘 -->
  <g>
    <rect x="560" y="770" width="120" height="22" rx="6" fill="#5c0310"/>
    <rect x="575" y="792" width="90" height="110" fill="#7a0415"/>
    <g stroke="#5c0310" stroke-width="3"><path d="M575 812 H665"/><path d="M575 832 H665"/><path d="M575 852 H665"/><path d="M575 872 H665"/></g>
    <rect x="560" y="902" width="120" height="22" rx="6" fill="#5c0310"/>
    <path d="M665 830 Q740 800 720 700 L716 660" fill="none" stroke="#7a0415" stroke-width="4"/>
    <path d="M716 560 L716 680" stroke="#6b6264" stroke-width="6" stroke-linecap="round"/>
