    <path d="M480 446 l10 24 24 10 -24 10 -10 24 -10 -24 -24 -10 24 -10 z" fill="#f3eee8"/>
  </g>

  <!-- 줄자 -->
  <g>
    <path d="M280 700 Q480 650 720 720" fill="none" stroke="#e9b949" stroke-width="30" stroke-linecap="round"/>
    <path d="M280 700 Q480 650 720 720" fill="none" stroke="#1f191a" stroke-width="30" stroke-dasharray="2 22" opacity=".55"/>
  </g>

  <!-- 가위 -->
  <g transform="translate(150 800) rotate(-24)">
    <rect x="0" y="-8" width="200" height="16" rx="8" fill="#b5adab"/>
    <rect x="0" y="-8" width="200" height="16" rx="8" fill="#9b9391" transform="rotate(14)"/>
    <circle cx="-30" cy="-26" r="30" fill="none" stroke="#1f191a" stroke-width="16"/>
    <circle cx="-38" cy="28" r="30" fill="none" stroke="#1f191a" stroke-width="16"/>
    <circle cx="10" cy="0" r="7" fill="#1f191a"/>
